name: Atualizar vídeos do YouTube

on:
  schedule:
    - cron: '17 */6 * * *'   # a cada 6 horas (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ler o feed e atualizar data/videos.json
        run: node scripts/youtube-feed.js
      - name: Commit se mudou
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/videos.json
          git diff --staged --quiet || (git commit -m "Atualiza vídeos do YouTube [skip ci]" && git push)
